name: Nexus CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Navigate to the API repository directory on the server
            cd ${{ secrets.SERVER_PROJECT_PATH || '/srv/blog' }}/apps/api
            
            # Clean up any crashed Git lock files to prevent lock-outs
            rm -f .git/refs/remotes/origin/main.lock
            rm -f .git/index.lock
            
            # Clean and reset to the latest origin/main code
            git fetch --all && git reset --hard origin/main
            
            # Navigate to the root directory containing the compose.yaml file
            cd ${{ secrets.SERVER_PROJECT_PATH || '/srv/blog' }}
            
            # Stop and remove any conflicting orphaned containers for this service
            docker compose rm -fs api || true
            
            # Rebuild and restart only the API service container
            docker compose up -d --build api
