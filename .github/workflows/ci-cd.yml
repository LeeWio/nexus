name: Nexus CI/CD

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: leewio/nexus-api
  ALIYUN_REGISTRY: crpi-jljp0dhu73tl5aot.cn-shenzhen.personal.cr.aliyuncs.com
  ALIYUN_IMAGE_NAME: wei_li/nexus-api

jobs:
  verify:
    name: Verify API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup API Environment
        uses: ./.github/actions/setup-api

      - name: Verify Maven Wrapper
        run: chmod +x mvnw

      - name: Resolve Formatting Baseline
        id: formatting-baseline
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and Package API
        run: >-
          ./mvnw -B -ntp clean spotless:check pmd:pmd verify
          -Dspotless.ratchetFrom=${{ steps.formatting-baseline.outputs.ref }}
          -Dnexus.openapi.output=target/nexus-openapi.json

      - name: Upload Nexus OpenAPI Contract
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nexus-openapi-${{ github.sha }}
          path: target/nexus-openapi.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-quality-reports-${{ github.run_id }}
          path: |
            target/pmd.xml
            target/site/pmd.html
            target/site/jacoco
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-test-reports-${{ github.run_id }}
          path: target/surefire-reports
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Packaged JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-jar-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1

  migration-verify:
    name: Verify Flyway Migrations on MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/nexus_migration_ci?allowPublicKeyRetrieval=true&useSSL=false
    concurrency:
      group: nexus-api-migrations-${{ github.ref }}
      cancel-in-progress: true
    services:
      mysql:
        image: mysql:8.4.9
        env:
          MYSQL_DATABASE: nexus_migration_ci
          MYSQL_USER: nexus
          MYSQL_PASSWORD: nexus_ci_password
          MYSQL_ROOT_PASSWORD: nexus_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -unexus -pnexus_ci_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Apply Base Branch Migrations
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          migrations=src/main/resources/db/migration
          base_snapshot="$(mktemp -d)"
          git archive "$BASE_SHA" "$migrations" | tar -x -C "$base_snapshot"
          docker run --rm --network host \
            -v "$base_snapshot/$migrations:/flyway/sql:ro" \
            flyway/flyway:11.14.1 \
            -url="$MYSQL_URL" \
            -user=nexus \
            -password=nexus_ci_password \
            -locations=filesystem:/flyway/sql \
            -connectRetries=60 \
            -validateMigrationNaming=true \
            migrate

      - name: Apply Candidate Migrations
        run: |
          docker run --rm --network host \
            -v "${GITHUB_WORKSPACE}/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.14.1 \
            -url="$MYSQL_URL" \
            -user=nexus \
            -password=nexus_ci_password \
            -locations=filesystem:/flyway/sql \
            -connectRetries=60 \
            -validateMigrationNaming=true \
            migrate

      - name: Validate Applied Migration History
        run: |
          docker run --rm --network host \
            -v "${GITHUB_WORKSPACE}/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.14.1 \
            -url="$MYSQL_URL" \
            -user=nexus \
            -password=nexus_ci_password \
            -locations=filesystem:/flyway/sql \
            validate

      - name: Setup API Environment
        uses: ./.github/actions/setup-api

      - name: Test Application against the Migrated MySQL Schema
        run: |
          ./mvnw -B -ntp -Dtest=AuthControllerIntegrationTest,PublicAnalyticsControllerIntegrationTest,MomentBookmarkMySqlIntegrationTest,MomentSubscriptionMySqlIntegrationTest,WebhookRetryIntegrationTest,NotificationReadingMySqlIntegrationTest,NotificationDeliveryRetentionMySqlIntegrationTest \
            "-Dspring.datasource.url=$MYSQL_URL" \
            -Dspring.datasource.username=nexus \
            -Dspring.datasource.password=nexus_ci_password \
            -Dspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver \
            -Dspring.jpa.database-platform=org.hibernate.dialect.MySQLDialect \
            -Dspring.jpa.hibernate.ddl-auto=validate \
            -Dspring.flyway.enabled=true \
            -Dspring.flyway.validate-on-migrate=true \
            test

      - name: Export Migration Report
        if: always()
        run: |
          docker run --rm --network host \
            -v "${GITHUB_WORKSPACE}/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.14.1 \
            -url="$MYSQL_URL" \
            -user=nexus \
            -password=nexus_ci_password \
            -locations=filesystem:/flyway/sql \
            info > flyway-migration-report.txt

      - name: Upload Migration Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flyway-migration-report-${{ github.run_id }}
          path: flyway-migration-report.txt
          if-no-files-found: warn
          retention-days: 14

  build-and-push-image:
    name: Build and Push API Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, migration-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Packaged JAR
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: api-jar-${{ github.sha }}
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Package Prebuilt JAR and Push Image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: runner-prebuilt
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_IMAGE_NAME }}:latest
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Deployable Image for Critical Vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: json
          output: trivy-image-report.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          timeout: 10m

      - name: Upload Image Security Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-image-report-${{ github.run_id }}
          path: trivy-image-report.json
          if-no-files-found: warn
          retention-days: 14

  deploy-to-server:
    name: Deploy Immutable API Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    concurrency:
      group: nexus-api-production-deploy
      cancel-in-progress: false
    environment:
      name: production
    env:
      API_IMAGE: crpi-jljp0dhu73tl5aot.cn-shenzhen.personal.cr.aliyuncs.com/wei_li/nexus-api@${{ needs.build-and-push-image.outputs.image-digest }}
      API_LATEST_IMAGE: ghcr.io/leewio/nexus-api:latest
      EXPECTED_REVISION: ${{ github.sha }}
      SERVER_PROJECT_PATH: ${{ secrets.SERVER_PROJECT_PATH || '/srv/blog' }}
      ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
      ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      SERVER_SSH_FINGERPRINT: ${{ secrets.SERVER_SSH_FINGERPRINT }}
    steps:
      - name: Checkout Deployment Scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Pinned Production SSH Host Key
        run: |
          test -n "${SERVER_SSH_FINGERPRINT}" || {
            echo "SERVER_SSH_FINGERPRINT must be configured before production deployment"
            exit 1
          }

      - name: Prepare remote deployment script
        shell: bash
        run: |
          {
            printf '%s\n' "bash -s <<'PRODUCTION_DEPLOY_SCRIPT'"
            cat .github/scripts/deploy-storage.sh .github/scripts/deploy-api.sh
            printf '%s\n' PRODUCTION_DEPLOY_SCRIPT
          } > "$RUNNER_TEMP/production-deploy.sh"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          command_timeout: 40m
          envs: API_IMAGE,API_LATEST_IMAGE,EXPECTED_REVISION,SERVER_PROJECT_PATH,ALIYUN_REGISTRY,ALIYUN_REGISTRY_USER,ALIYUN_REGISTRY_PASSWORD
          script_path: ${{ runner.temp }}/production-deploy.sh
