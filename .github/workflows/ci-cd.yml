name: Nexus CI/CD

on:
  push:
    branches: [ "main" ]

concurrency:
  group: nexus-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Navigate to the API repository directory on the server
            cd ${{ secrets.SERVER_PROJECT_PATH || '/srv/blog' }}/apps/api
            
            # Clean up any crashed Git lock files to prevent lock-outs
            rm -f .git/refs/remotes/origin/main.lock
            rm -f .git/index.lock
            
            # Clean and reset to the latest origin/main code
            git fetch --all && git reset --hard origin/main
            
            # Navigate to the root directory containing the compose.yaml file
            cd ${{ secrets.SERVER_PROJECT_PATH || '/srv/blog' }}
            
            # Clean and build the new API image quietly with low CPU priority to protect the server
            export COMPOSE_PARALLEL_LIMIT=1
            nice -n 10 docker compose build api
            
            # Recreate and restart the API service container with zero downtime
            docker compose up -d --no-deps api
            
            # Safe garbage collection of dangling images left behind by the hot recreate
            docker image prune -f
