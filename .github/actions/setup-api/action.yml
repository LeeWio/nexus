name: 'Setup API Environment'
description: 'Standardized Java/JDK setup with native Maven dependency caching'

inputs:
  java-version:
    description: 'Version of JDK to install'
    required: false
    default: '21'
  distribution:
    description: 'JDK distribution'
    required: false
    default: 'corretto'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        cache: 'maven'
        cache-dependency-path: 'pom.xml'
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '5'
