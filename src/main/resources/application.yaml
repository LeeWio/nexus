      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:3499508634@qq.com}
    password: ${MAIL_PASSWORD:ygafxbvzkzehchgg}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: jdbc:mysql://localhost:3306/nexus_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: root
    password: G7v!p9Xq$2RfL8kM # 数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  security:
    user:
      name: admin
      password: admin_password # 默认测试账号的密码
    oauth2:
      client:
        registration:
          github:
            client-id: Ov23liYVcCWgk1bl3mhC
            client-secret: cab3348e1e8beee972eef2893562546bc5fa9d5c
            scope:
              - read:user
              - user:email
  
  data:
    elasticsearch:
      repositories:
        enabled: false
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 3s
    socket-timeout: 10s

  cache:
    type: redis
    redis:
      time-to-live: 3600000ms # 1 hour default
      use-key-prefix: true
      key-prefix: "nexus:cache:"
      cache-null-values: false

# Management / Monitoring
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "health,info,metrics,prometheus,beans"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# Logging Configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{36} - %msg%n"
  level:
    space.nebula.nexus: INFO
    org.hibernate.SQL: INFO

