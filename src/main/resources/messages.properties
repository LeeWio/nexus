# Standard Success/Error
200=Operation successful
500=Internal system error

# Auth & Security
401=Authentication failed
40101=Invalid or expired token
40102=Incorrect username or password
40103=Account is locked
40104=Account is disabled
403=Insufficient permissions

# Resource Errors
404=Resource not found
40401=User not found
40402=Post not found
40403=Category not found

# Request & Validation
400=Invalid request parameters
40001=Field validation failed
40002=Resource already exists
413=File size exceeds limit

# Domain Specific
40010=Post is already published
40011=Post is not yet published

# Rate Limiting
429=Too many requests, please try again later
