# Standard Success/Error
200=Operation successful
500=Internal server error

# Auth & Security
401=Authentication required
40101=Token is invalid or expired
40102=Invalid username or password
40103=Account is locked
40104=Account is disabled
403=Access denied

# Resource Errors
404=Resource not found
40401=User not found
40402=Post not found
40403=Category not found

# Request & Validation
400=Invalid request
40001=Validation failed
40002=Resource already exists
413=File exceeds the maximum size
41301=File size ({0}) exceeds the maximum allowed size ({1})
40003=Unsupported file type: {0}. Supported types: {1}

# Domain Specific
40010=Post is already published
40011=Post is not published

# Rate Limiting
429=Too many requests
