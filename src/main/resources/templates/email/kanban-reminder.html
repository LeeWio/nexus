<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kanban Task Reminder</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; background-color: #f4f7f6; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 20px auto; background-color: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.08); border-top: 6px solid #2ecc71; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #27ae60; margin: 0; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        .task-card { background-color: #ffffff; border: 1px solid #e1e8ed; border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        .task-title { font-size: 18px; font-weight: bold; color: #2c3e50; margin-bottom: 10px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }
        .task-meta { font-size: 14px; color: #7f8c8d; margin-bottom: 15px; }
        .priority-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white; margin-right: 10px; }
        .priority-high { background-color: #e74c3c; }
        .priority-medium { background-color: #f39c12; }
        .priority-low { background-color: #3498db; }
        .task-content { background-color: #fdfdfd; padding: 15px; border-radius: 6px; font-size: 15px; border-left: 3px solid #2ecc71; color: #444; }
        .footer { font-size: 0.85em; color: #95a5a6; border-top: 1px solid #eee; padding-top: 20px; text-align: center; }
        .system-tag { color: #bdc3c7; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Task Reminder</h1>
    </div>
    <div class="task-card">
        <div class="task-title" th:text="${taskTitle}">Task Title</div>
        <div class="task-meta">
            <span th:class="'priority-badge ' + ${priorityClass}" th:text="${priority}">MEDIUM</span>
            Column: <strong th:text="${columnName}">To Do</strong>
        </div>
        <div class="task-content">
            <p th:text="${taskContent}">This is the content of the task.</p>
        </div>
    </div>
    <p style="text-align: center;">
        Keep up the great work! You've got this.
    </p>
    <div class="footer">
        This is an automated reminder from your <span class="system-tag">Nexus Kanban Board</span>.
        <br/>
        &copy; 2026 Nexus System.
    </div>
</div>
</body>
</html>
