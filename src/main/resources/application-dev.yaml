spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:test}
    password: ${MAIL_PASSWORD:testpassword}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
      mail.smtp.timeout: 5000
      mail.smtp.connectiontimeout: 5000

  datasource:
    url: jdbc:mysql://localhost:3306/nexus_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: root
    password: password # Local dev only
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false # Bypass legcy checksum mismatches
    # Legacy databases were managed by Hibernate before Flyway was activated.
    # Baseline them at the last pre-adoption migration; empty databases still run from V1.
    baseline-version: 131
    out-of-order: true
    locations: classpath:db/migration

  security:
    user:
      name: admin
      password: admin_password
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_OAUTH_CLIENT_ID:dev-client-id}
            client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:dev-client-secret}
            scope:
              - read:user
              - user:email
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:dev-google-client-id}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:dev-google-client-secret}
            scope:
              - openid
              - profile
              - email
  
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:nexus}
    password: ${RABBITMQ_PASSWORD:nexus_password}

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 3s
    socket-timeout: 10s

app:
  # OAuth providers redirect to backend callback URLs; this is the final frontend destination.
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
  security:
    rate-limit:
      enabled: false
  jwt:
    secret: "4A614E645267556B58703273357638792F423F4528482B4D6251655468576D5A" # Dev only
  github:
    token: "dev-token"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,beans"
