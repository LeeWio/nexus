spring:
  mail:
    host: localhost
    port: 1025
    username: test
    password: testpassword
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  datasource:
    url: jdbc:mysql://localhost:3306/nexus_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: root
    password: password # Local dev only
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: true
    locations: classpath:db/migration

  security:
    user:
      name: admin
      password: admin_password
    oauth2:
      client:
        registration:
          github:
            client-id: dev-client-id
            client-secret: dev-client-secret
            scope:
              - read:user
              - user:email
  
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 3s
    socket-timeout: 10s

app:
  jwt:
    secret: "4A614E645267556B58703273357638792F423F4528482B4D6251655468576D5A" # Dev only
  github:
    token: "dev-token"
