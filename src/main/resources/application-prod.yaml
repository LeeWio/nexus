spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
      mail.smtp.timeout: ${MAIL_TIMEOUT:5000}
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nexus_db}?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate # Do not auto-update schema in prod
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    # Legacy databases were managed by Hibernate before Flyway was activated.
    # Baseline them at the last pre-adoption migration; empty databases still run from V1.
    baseline-version: 131
    out-of-order: false # Strict ordering in prod

  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD}
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_OAUTH_CLIENT_ID}
            client-secret: ${GITHUB_OAUTH_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
  
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  elasticsearch:
    uris: ${ES_URIS}

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI}
  jwt:
    secret: ${JWT_SECRET}
  github:
    token: ${GITHUB_TOKEN}

logging:
  structured:
    format:
      console: logstash
    json:
      context:
        include: true
      add:
        "service.name": ${spring.application.name}
        "deployment.environment": production
