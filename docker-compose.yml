services:
  nexus-app:
    build: .
    container_name: nexus-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=common,dev
      - APP_SEARCH_TYPE=database
      - SPRING_DATASOURCE_URL=jdbc:mysql://nexus-db:3306/nexus_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=nexus_password
      - SPRING_DATA_REDIS_HOST=nexus-redis
      - RABBITMQ_HOST=nexus-rabbitmq
      - ES_URIS=http://nexus-elasticsearch:9200
      - MANAGEMENT_HEALTH_MAIL_ENABLED=false
      - MAIL_HOST=nexus-mail
      - MAIL_PORT=1025
      - MAIL_USERNAME=test@nexus.com
      - MAIL_PASSWORD=testpassword
      - MAIL_AUTH=false
      - MAIL_SSL=false
      - MAIL_STARTTLS=false
    depends_on:
      nexus-db:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
      nexus-rabbitmq:
        condition: service_healthy
      nexus-elasticsearch:
        condition: service_healthy
      nexus-mail:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nexus-network
    restart: always

  nexus-mail:
    image: axllent/mailpit:latest
    container_name: nexus-mail
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - nexus-network
    restart: always

  nexus-db:
    image: mysql:8.0
    container_name: nexus-db
    environment:
      - MYSQL_DATABASE=nexus_db
      - MYSQL_ROOT_PASSWORD=nexus_password
      - MYSQL_USER=canal
      - MYSQL_PASSWORD=canal_password
    ports:
      - "3307:3306"
    volumes:
      - nexus-db-data:/var/lib/mysql
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  nexus-redis:
    image: redis:7.4-alpine
    container_name: nexus-redis
    ports:
      - "6380:6379"
    volumes:
      - nexus-redis-data:/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  nexus-rabbitmq:
    image: rabbitmq:3.13-management
    container_name: nexus-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=nexus
      - RABBITMQ_DEFAULT_PASS=nexus_password
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: always

  nexus-canal-server:
    image: canal/canal-server:v1.1.7
    container_name: nexus-canal-server
    ports:
      - "11111:11111"
    environment:
      - canal.auto.scan=false
      - canal.destinations=test
      - canal.instance.master.address=nexus-db:3306
      - canal.instance.dbUsername=canal
      - canal.instance.dbPassword=canal_password
      - canal.instance.filter.regex=nexus_db\\..*
      - canal.serverMode=rabbitmq
      - rabbitmq.host=nexus-rabbitmq
      - rabbitmq.port=5672
      - rabbitmq.username=nexus
      - rabbitmq.password=nexus_password
      - rabbitmq.exchange=canal.exchange
      - canal.mq.topic=canal.routing.key
    depends_on:
      nexus-db:
        condition: service_healthy
      nexus-rabbitmq:
        condition: service_started
    networks:
      - nexus-network
    restart: always

  nexus-elasticsearch:
    image: elasticsearch:9.2.8
    container_name: nexus-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - nexus-es-data:/usr/share/elasticsearch/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: always

networks:
  nexus-network:
    driver: bridge

volumes:
  nexus-db-data:
  nexus-redis-data:
  nexus-es-data:
